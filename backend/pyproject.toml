[project]
name = "patent-creator-backend"
version = "0.4.1"
description = "FastAPI backend for the patent disclosure AI agent workspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "openai>=2.44.0,<3.0.0",
  "pillow>=12.2.0",
  "python-docx>=1.2.0",
  "uvicorn>=0.30.0,<1.0.0",
  "wcmatch>=10,<11",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
